[Require basic.ini]

############################################################################
# General Parameters.                                                      #
############################################################################

[General]
Vehicle                                 = ntnu-otter-03

[Transports.UDP]
Local Port                              = 6003

[Transports.HTTP]
Port                                    = 8081

[Transports.FTP]
Control Port                            = 30022
Data Port                               = 30023

[Transports.TCP.Client]
Enabled                                 = Hardware
Entity Label                            = TCP with FishData
Server - Address                        = 10.8.0.5
Server - Port                           = 9802
Transports                              = TBRFishTag,
                                          PlanControl,
                                          Reference

[Transports.UDP/Negotiation]
Enabled                 		        = Always
Entity Label                		    = Negotiation Message
Dynamic Nodes                           = false
Announce Service                        = false
Local Messages Only                     = true
Static Destinations         		    = 10.8.0.5:6019, 10.8.0.6:6019#10.8.0.4:6019
Transports              		        = NegotiationData,
                                          AisInfo
Rate Limiters               		    = NegotiationData:2,
                                          AisInfo:2
Local Port              		        = 6019


[Control.Path.COLAV.ColavSbmpcNegotiation]
Enabled                                 		= Always
Entity Label                            		= Path Control
Debug Level						= Spew
MMSI                                    		= 113
Collaborative COLAV					= true
COLAV Algorithm						= 1	# 1=SB-MPC, 2=Velocity Obstacle
Guidance Method						= 1	# 1=Pure pursuit, 2=LOS
Control Frequency					= 1
Cross-track -- Monitor                  		= false
ILOS Lookahead Distance					= 50
Cross-track -- Distance Limit				= 100
Cross-track -- Time Limit				= 300
Along-track -- Monitor                  		= false
Prediction Horizon - Simulation Time                    = 300
Horizon Time Step                                       = 1
Weight on Time to Evaluation Instant                    = 1.0
Weight on Distance at Evaluation Instant                = 3.0
COLREGS Distance                                        = 150.0
Minimum safe distance to vessels                        = 20.0
PHI AH                                                  = 22.5
PHI OT                                                  = 68.5
PHI HO                                                  = 22.5
PHI CR                                                  = 68.5
##### COLAV parameters
Cost of collisions                                      = 2.5   # N/A in Velocity Obstacle
Cost of not complying COLREGS                           = 1.0 
Cost of Deviating from Nominal Speed                    = 1.5
Cost of Changing Speed Offset                           = 1.0 	# N/A in Velocity Obstacle
Cost of Deviating from Nominal Course                   = 1.0 	# N/A in Velocity Obstacle 
Cost of Course offset change				= 1.0 	# N/A in Velocity Obstacle
#####
Cost of Course change to SB                             = 1.0	# N/A in Velocity Obstacle
Cost of Course change to Port                           = 1.5	# N/A in Velocity Obstacle

[Control.Path.COLAV.TargetTracking]
Enabled					                = Always
Entity Label				            = TargetTracking
Debug Level                             = Spew
Maximum Obstacle Surveillance Range     = 5000

[Simulators.AIS]
Enabled                                 = Simulation
Entity Label				            = AIS
Ais5 Broadcast Frequency                = 5
Ais123 Broadcast Frequency Static       = 5
Ais123 Broadcast Frequency Moving       = 10
Sensor Class                            = A
MMSI                                    = 113
Callsign                                = asv3-callsign
Name                                    = asv3
Type and Cargo                          = 101
Size A                                  = 10.0
Size B                                  = 10.0
Size C                                  = 1.5
Size D					                = 1.5
Draught                                 = 5
Activation Time                         = 0
Execution Priority                      = 10
Debug Level                             = None

[Simulators.GPS]
Initial Position                        = 63.33059985, 10.08879302

[Control.Path.ILOSOtter]
Enabled                                 = Never

[Supervisors.Vehicle]
Allows External Control                 = true