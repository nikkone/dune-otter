############################################################################
# Otter USV 01 configuration file.                                         #
############################################################################

[Require basic.ini]

############################################################################
# General Parameters.                                                      #
############################################################################

[General]
Vehicle                                 = ntnu-otter-01

[Control.ASV.HeadingAndSpeedForce]
Enabled                                 = Never

[Control.ASV.HeadingAndSpeedPeriodicForce]
Enabled                                 = Hardware, Simulation
Execution Frequency                     = 3
Entity Label                            = Autopilot
Debug Level                             = Spew
Maximum Thrust Actuation                = 1.0
Ramp Actuation Limit                    = 0.0
MPS Force PID Gains                     = 142.9, 9.16, 150.0
MPS Force Integral Limit                = 240
MPS Force Feedforward Gain              = 0.0
Yaw PID Gains                           = 60.0, 0.0, 0.0
Maximum Heading Error to Thrust         = 30.0
Minimum Force Limit                     = -37
Share Saturation                        = false
Log PID Parcels                         = true