# Otter USV 01 configuration file.                                         #
############################################################################

[Require basic.ini]

############################################################################
# General Parameters.                                                      #
############################################################################

[General]
Vehicle                                 = ntnu-otter-02

[Transports.UDP]
Local Port                              = 6004

[Transports.HTTP]
Port                                    = 8082

[Transports.FTP]
Control Port                            = 30024
Data Port                               = 30025

[Transports.UDP/Negotiation]
Enabled                 		        = Always
Entity Label                		    = Negotiation Message
Dynamic Nodes                           = false
Announce Service                        = false
Local Messages Only                     = true
Static Destinations         		    = 10.8.0.4:46019, 10.8.0.5:46019#, 10.8.0.6:46019
Transports              		        = NegotiationData,
                                          AisInfo
Rate Limiters               		    = NegotiationData:2,
                                          AisInfo:2
Local Port              		        = 6019

[Control.Path.COLAV.ColavSbmpcNegotiation]
Enabled                                 = Always
Entity Label                            = Path Control
Debug Level				                = Spew
MMSI                                    = 112
Collaborative COLAV				        = true
ILOS Lookahead Distance					= 50
Cross-track -- Monitor                  = false
Along-track -- Monitor                  = false
Prediction Horizon - Simulation Time    = 600
Horizon Time Step                       = 1
Weight on Time to Evaluation Instant    = 1.0
Weight on Distance at Evaluation Instant= 2.0
COLREGS Distance                        = 200.0
Minimum safe distance to vessels        = 30.0
Cost of collisions                      = 1.0
Cost of not complying COLREGS           = 5.0
PHI AH                                  = 22.5
PHI OT                                  = 68.5
PHI HO                                  = 22.5
PHI CR                                  = 68.5
Cost of Deviating from Nominal Speed    = 0.8
Cost of Changing Speed Offset           = 1.0
Cost of Deviating from Nominal Course   = 1.0
Cost of Course change to SB             = 1.0
Cost of Course change to Port           = 1.5

[Control.Path.COLAV.TargetTracking]
Enabled					                = Always
Entity Label			            	= TargetTracking
Debug Level                             = Spew
Maximum Obstacle Surveillance Range     = 5000

[Simulators.AIS]
Enabled                                 = Always
Entity Label				            = AIS
Ais5 Broadcast Frequency                = 5
Ais123 Broadcast Frequency Static       = 5
Ais123 Broadcast Frequency Moving       = 10
Sensor Class                            = A
MMSI                                    = 112
Callsign                                = asv2-callsign
Name                                    = asv2
Type and Cargo                          = 101
Size A                                  = 10.0
Size B                                  = 10.0
Size C                                  = 1.5
Size D					                = 1.5
Draught                                 = 5
Activation Time                         = 0
Execution Priority                      = 10
Debug Level                             = None

# GPS simulator.
[Simulators.GPS]
Initial Position                        = 63.33320675, 10.0827299

[Control.Path.ILOSOtter]
Enabled                                 = Never

[Supervisors.Vehicle]
Allows External Control                 = true